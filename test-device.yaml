esphome:
  name: balboa-test
external_components:
  - source:
      type: local
      path: components

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  baud_rate: 0  # disable logging on UART0 TX; USB CDC/JTAG still shows logs

uart:
  id: spa_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 115200
  rx_buffer_size: 512

balboa_spa:
  id: spa
  uart_id: spa_uart
  read_only: true

climate:
  - platform: balboa_spa
    name: "Spa"
    balboa_spa_id: spa

sensor:
  - platform: balboa_spa
    balboa_spa_id: spa
    type: current_temperature
    name: "Spa Current Temperature"
    unit_of_measurement: "°F"
    device_class: temperature
    accuracy_decimals: 0

binary_sensor:
  - platform: balboa_spa
    balboa_spa_id: spa
    type: heating
    name: "Spa Heating"
    device_class: heat
