esphome:
  name: balboa-test
external_components:
  - source:
      type: local
      path: components

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: arduino

logger:
  # C3: RS-485 is on UART1 (GPIO4/5); logs stream over USB Serial/JTAG.

uart:
  id: spa_uart
  tx_pin: GPIO4   # -> HW-0519 RXD  (ESP32-C3 UART1)
  rx_pin: GPIO5   # <- HW-0519 TXD
  baud_rate: 115200
  rx_buffer_size: 512

balboa_spa:
  id: spa
  uart_id: spa_uart
  read_only: true

climate:
  - platform: balboa_spa
    name: "Spa"
    balboa_spa_id: spa

sensor:
  - platform: balboa_spa
    balboa_spa_id: spa
    type: current_temperature
    name: "Spa Current Temperature"
    unit_of_measurement: "°F"
    device_class: temperature
    accuracy_decimals: 0

binary_sensor:
  - platform: balboa_spa
    balboa_spa_id: spa
    type: heating
    name: "Spa Heating"
    device_class: heat

text_sensor:
  - platform: balboa_spa
    balboa_spa_id: spa
    type: model
    name: "Spa Model"

switch:
  - platform: balboa_spa
    balboa_spa_id: spa
    type: light
    index: 1
    name: "Spa Light"

fan:
  - platform: balboa_spa
    balboa_spa_id: spa
    type: pump
    index: 1
    speed_count: 2
    name: "Spa Pump 1"

select:
  - platform: balboa_spa
    balboa_spa_id: spa
    type: heating_mode
    name: "Spa Heating Mode"

number:
  - platform: balboa_spa
    balboa_spa_id: spa
    type: c1_duration
    name: "Spa Filter Cycle 1 Duration"
    unit_of_measurement: "min"

button:
  - platform: balboa_spa
    balboa_spa_id: spa
    type: clear_notification
    name: "Spa Clear Notification"
