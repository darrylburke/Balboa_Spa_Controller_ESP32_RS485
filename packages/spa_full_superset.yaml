# Default one-pump/one-light entity set. Pump 1 is a switch because it is operated
# as on/off; ON requests low speed and OFF requests stopped. Use the fan platform
# instead when Home Assistant speed selection is needed. Uncomment other
# equipment only after checking the pack's reported configuration.

climate:
  - platform: balboa_spa
    name: "Spa"
    balboa_spa_id: spa

switch:
  - platform: balboa_spa
    balboa_spa_id: spa
    type: pump
    index: 1
    name: "Spa Jets"
  - platform: balboa_spa
    balboa_spa_id: spa
    type: light
    index: 1
    name: "Spa Light"
  - platform: balboa_spa
    balboa_spa_id: spa
    type: hold
    name: "Spa Hold"

# Alternative when speed selection is wanted instead of a switch:
# fan:
#   - platform: balboa_spa
#     balboa_spa_id: spa
#     type: pump
#     index: 1
#     speed_count: 2
#     name: "Spa Jets"
  # - platform: balboa_spa   # pump 2 (multi-pump spas only)
  #   balboa_spa_id: spa
  #   type: pump
  #   index: 2
  #   speed_count: 2
  #   name: "Spa Jets 2"
  # - platform: balboa_spa   # blower (not present on Cambridge)
  #   balboa_spa_id: spa
  #   type: blower
  #   speed_count: 2
  #   name: "Spa Blower"

  # - platform: balboa_spa   # mister / aux not present on Cambridge
  #   balboa_spa_id: spa
  #   type: mister
  #   name: "Spa Mister"

select:
  - platform: balboa_spa
    balboa_spa_id: spa
    type: heating_mode
    name: "Spa Heating Mode"
  - platform: balboa_spa
    balboa_spa_id: spa
    type: temperature_range
    name: "Spa Temperature Range"
  - platform: balboa_spa
    balboa_spa_id: spa
    type: temperature_scale
    name: "Spa Temperature Scale"

sensor:
  - platform: balboa_spa
    balboa_spa_id: spa
    type: current_temperature
    name: "Spa Current Temperature"
    # Celsius is the canonical unit on the wire (matches the climate entity).
    # device_class: temperature lets Home Assistant display °F if you prefer;
    # the SaaS panel converts using select/spa_temperature_scale.
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
  - platform: balboa_spa
    balboa_spa_id: spa
    type: target_temperature
    name: "Spa Target Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

binary_sensor:
  - platform: balboa_spa
    balboa_spa_id: spa
    type: heating
    name: "Spa Heating"
    device_class: heat
  - platform: balboa_spa
    balboa_spa_id: spa
    type: priming
    name: "Spa Priming"
  - platform: balboa_spa
    balboa_spa_id: spa
    type: filter1_running
    name: "Spa Filter Cycle 1 Running"
  - platform: balboa_spa
    balboa_spa_id: spa
    # Liveness of the RS-485 link itself. MQTT availability only describes the
    # ESP32-to-broker connection; the pack or wiring can fail while MQTT stays up.
    # Use this sensor to distinguish stale spa readings from a healthy bus.
    type: bus_connected
    name: "Spa Bus Connected"
    device_class: connectivity
  # - platform: balboa_spa   # circulation pump (uncomment if discovery reports it)
  #   balboa_spa_id: spa
  #   type: circulation_pump
  #   name: "Spa Circulation Pump"

text_sensor:
  - platform: balboa_spa
    balboa_spa_id: spa
    type: model
    name: "Spa Model"
  - platform: balboa_spa
    balboa_spa_id: spa
    type: version
    name: "Spa Firmware Version"
  - platform: balboa_spa
    balboa_spa_id: spa
    type: notification
    name: "Spa Notification"

number:
  - platform: balboa_spa
    balboa_spa_id: spa
    type: c1_start_hour
    name: "Spa Filter 1 Start Hour"
  - platform: balboa_spa
    balboa_spa_id: spa
    type: c1_duration
    name: "Spa Filter 1 Duration"
    unit_of_measurement: "min"

button:
  - platform: balboa_spa
    balboa_spa_id: spa
    type: clear_notification
    name: "Spa Clear Notification"
  - platform: balboa_spa
    balboa_spa_id: spa
    type: normal_operation
    name: "Spa Normal Operation"
