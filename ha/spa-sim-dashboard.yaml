# =============================================================================
# Spa (Simulated) — generated by ha/gen-dashboard.js (sim)
#
# PART 1 goes in configuration.yaml (merge into your existing top-level keys).
# PART 2 is the Lovelace dashboard: Settings > Dashboards > new dashboard,
#        then three-dot menu > "Raw configuration editor" and paste.
#
# Entity ids assume HA derived them from the MQTT names. If HA appended
# suffixes (_2 etc.), adjust the ids at the top of this file and regenerate.
# =============================================================================


# ----------------------------- PART 1: configuration.yaml --------------------
# Fahrenheit companions. The wire is always Celsius; these derive °F with a
# FIXED unit, which is safe. Never publish a value whose unit varies at runtime.

template:
  - sensor:
      - name: "Spa (Simulated) Current Temperature F"
        unique_id: balboa_spa_simulated_spa_sim_current_temperature_f
        unit_of_measurement: "°F"
        device_class: temperature
        state_class: measurement
        availability: "{{ states('sensor.balboa_spa_simulated_spa_sim_current_temperature') not in ['unknown','unavailable',''] }}"
        state: "{{ (states('sensor.balboa_spa_simulated_spa_sim_current_temperature') | float * 9 / 5 + 32) | round(1) }}"

      - name: "Spa (Simulated) Target Temperature F"
        unique_id: balboa_spa_simulated_spa_sim_target_temperature_f
        unit_of_measurement: "°F"
        device_class: temperature
        state_class: measurement
        availability: "{{ states('sensor.balboa_spa_simulated_spa_sim_target_temperature') not in ['unknown','unavailable',''] }}"
        state: "{{ (states('sensor.balboa_spa_simulated_spa_sim_target_temperature') | float * 9 / 5 + 32) | round(1) }}"


# ----------------------------- PART 2: Lovelace dashboard --------------------
views:
  - title: Spa (Simulated)
    path: balboa_spa_simulated_spa_sim
    icon: mdi:hot-tub
    cards:

      # --- Bus/availability warning. Only appears when something is wrong, so
      # --- a healthy dashboard stays clean.
      - type: conditional
        conditions:
          - entity: binary_sensor.balboa_spa_simulated_spa_sim_bus_connected
            state_not: "on"
        card:
          type: markdown
          content: >
            ## ⚠️ Spa unreachable

            The gateway is not receiving data from the spa over RS-485.
            **Values below are the last known readings and may be stale.**

      # --- Headline instrument: temperatures in the SPA's own scale ---
      - type: markdown
        content: >
          # {% set v = states('sensor.balboa_spa_simulated_spa_sim_current_temperature') | float(0) %}{% if is_state('select.balboa_spa_simulated_spa_sim_temperature_scale', 'celsius') %}{{ v | round(1) }} °C{% else %}{{ (v * 9 / 5 + 32) | round(1) }} °F{% endif %}

          ### Set to {% set v = states('sensor.balboa_spa_simulated_spa_sim_target_temperature') | float(0) %}{% if is_state('select.balboa_spa_simulated_spa_sim_temperature_scale', 'celsius') %}{{ v | round(1) }} °C{% else %}{{ (v * 9 / 5 + 32) | round(1) }} °F{% endif %}

          {% if is_state('binary_sensor.balboa_spa_simulated_spa_sim_heating', 'on') %}🔥 **Heating**
          {% elif is_state('select.balboa_spa_simulated_spa_sim_heating_mode', 'rest') %}💤 Rest mode — heater disabled
          {% else %}✓ Idle — at temperature{% endif %}
          {% if is_state('binary_sensor.balboa_spa_simulated_spa_sim_filter_cycle_1_running', 'on') %} · 🌀 Filtering{% endif %}
          {% if states('sensor.balboa_spa_simulated_spa_sim_notification') not in ['', 'unknown', 'unavailable'] %}

          ⚠️ Notification: **{{ states('sensor.balboa_spa_simulated_spa_sim_notification') }}**
          {% endif %}

      # --- Gauge, shown in whichever scale the spa is using ---
      - type: conditional
        conditions:
          - entity: select.balboa_spa_simulated_spa_sim_temperature_scale
            state: fahrenheit
        card:
          type: gauge
          entity: sensor.spa_simulated_current_temperature_f
          name: Water
          min: 50
          max: 106
          needle: true
          severity: { green: 98, yellow: 80, red: 104 }
      - type: conditional
        conditions:
          - entity: select.balboa_spa_simulated_spa_sim_temperature_scale
            state: celsius
        card:
          type: gauge
          entity: sensor.balboa_spa_simulated_spa_sim_current_temperature
          name: Water
          min: 10
          max: 41
          needle: true
          severity: { green: 36, yellow: 26, red: 40 }

      # --- Setpoint control ---
      - type: thermostat
        entity: climate.balboa_spa_simulated_spa_sim
        features:
          - type: target-temperature

      # --- Everyday controls ---
      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: switch.balboa_spa_simulated_spa_sim_light
            name: Light
            icon: mdi:lightbulb
          - type: tile
            entity: fan.balboa_spa_simulated_spa_sim_jets
            name: Jets
            icon: mdi:chart-bubble
            features:
              - type: fan-speed
          - type: tile
            entity: select.balboa_spa_simulated_spa_sim_heating_mode
            name: Mode
            icon: mdi:thermostat
            features:
              - type: select-options
          - type: tile
            entity: select.balboa_spa_simulated_spa_sim_temperature_range
            name: Range
            icon: mdi:thermometer-lines
            features:
              - type: select-options

      # --- Status at a glance ---
      - type: entities
        title: Status
        show_header_toggle: false
        entities:
          - entity: binary_sensor.balboa_spa_simulated_spa_sim_bus_connected
            name: Spa link
          - entity: binary_sensor.balboa_spa_simulated_spa_sim_heating
            name: Heater
          - entity: binary_sensor.balboa_spa_simulated_spa_sim_circulation_pump
            name: Circulation pump
          - entity: binary_sensor.balboa_spa_simulated_spa_sim_filter_cycle_1_running
            name: Filter cycle
          - entity: binary_sensor.balboa_spa_simulated_spa_sim_priming
            name: Priming
          - entity: switch.balboa_spa_simulated_spa_sim_hold
            name: Hold

      # --- Filter schedule + maintenance ---
      - type: entities
        title: Filter cycle
        show_header_toggle: false
        entities:
          - entity: number.balboa_spa_simulated_spa_sim_filter_1_start_hour
            name: Start hour
          - entity: number.balboa_spa_simulated_spa_sim_filter_1_duration
            name: Duration
          - type: divider
          - entity: button.balboa_spa_simulated_spa_sim_clear_notification
            name: Clear notification
          - entity: button.balboa_spa_simulated_spa_sim_normal_operation
            name: Normal operation

      # --- Diagnostics, collapsed by default ---
      - type: entities
        title: Diagnostics
        show_header_toggle: false
        entities:
          - entity: sensor.balboa_spa_simulated_spa_sim_model
            name: Model
          - entity: sensor.balboa_spa_simulated_spa_sim_firmware_version
            name: Firmware
          - entity: select.balboa_spa_simulated_spa_sim_temperature_scale
            name: Panel scale
          - entity: sensor.balboa_spa_simulated_spa_sim_current_temperature
            name: Water (raw °C)
          - entity: sensor.balboa_spa_simulated_spa_sim_target_temperature
            name: Setpoint (raw °C)

