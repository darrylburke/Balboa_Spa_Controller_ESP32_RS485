      temperature_command_topic: "spa-sim/climate/spa/target_temperature/command"
      action_topic: "spa-sim/climate/spa/action/state"
      min_temp: 10
      max_temp: 40
      temp_step: 0.5
      temperature_unit: C
      precision: 0.1
      retain: false
      availability:
        - topic: "spa-sim/status"
          payload_available: "online"
          payload_not_available: "offline"
      device:
        identifiers: "balboa_spa_sim"
        name: "Balboa Spa (Simulated)"
        manufacturer: "Balboa Water Group"
        model: "CNBP501X"

