  - climate:
      name: "Spa Sim"
      unique_id: balboa_spa_sim_climate
      modes: ["off", "heat"]
      mode_state_topic: "spa-sim/climate/spa/mode/state"
      mode_command_topic: "spa-sim/climate/spa/mode/command"
