esphome:
  name: balboa-spa
  friendly_name: Hot Tub

external_components:
  - source:
      type: local
      path: components

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Balboa-Spa Fallback"
    password: !secret ap_password

captive_portal:

logger:
  level: INFO
  baud_rate: 0   # free UART0; logs available over MQTT/web/USB-CDC

mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  topic_prefix: spa
  discovery: true

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80

time:
  - platform: sntp
    id: sntp_time

uart:
  id: spa_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 115200
  rx_buffer_size: 512

balboa_spa:
  id: spa
  uart_id: spa_uart
  time_id: sntp_time
  read_only: true   # FLIP TO false ONLY AFTER confirming clean decode (see docs/bring-up)

packages:
  spa_entities: !include packages/spa_full_superset.yaml
