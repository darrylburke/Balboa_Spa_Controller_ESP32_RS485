  skip_cert_cn_check: false
  # Publish from ESP-IDF's MQTT task so TLS writes never stall the RS-485 loop.
  idf_send_async: true
  topic_prefix: spa
  discovery: true
  # Uses ESPHome's default discovery prefix, "homeassistant". HA's MQTT
  # integration is set to match. Deliberately NOT "ha": ~131 unrelated config
  # topics live under ha/, and pointing HA there would auto-create duplicates of
  # devices already declared by hand in configuration.yaml.

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80

time:
  - platform: sntp
    id: sntp_time

uart:
  id: spa_uart
  # ESP32-C3 UART1 via the GPIO matrix. Same MAX485 breakout and wiring as the
  # Jandy bridge: TX->DI, RX<-RO, GPIO3 -> DE+/RE (see direction_pin below).
  # (Avoid strapping GPIO2/8/9, flash 12-17, USB 18/19, UART0 20/21.)
  tx_pin: GPIO5
  rx_pin: GPIO4
  baud_rate: 115200
  rx_buffer_size: 512

balboa_spa:
  id: spa
  uart_id: spa_uart
  time_id: sntp_time
  direction_pin: GPIO3   # LOW = listen; driven HIGH only while transmitting
  read_only: false      # read/write: negotiates a bus channel, accepts commands
  uart_selftest: false  # BRING-UP ONLY: RS-485 module disconnected, TX jumpered to RX

packages:
  spa_entities: !include packages/spa_full_superset.yaml
