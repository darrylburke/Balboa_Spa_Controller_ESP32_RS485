esphome:
  name: balboa-spa
  friendly_name: Hot Tub

external_components:
  - source:
      type: local
      path: components

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Balboa-Spa Fallback"
    password: !secret ap_password

captive_portal:

logger:
  level: INFO
  # C3: RS-485 is on UART1 (GPIO4/5), so UART0/USB stays free for logs.
  # Logs stream over the native USB Serial/JTAG (+ web_server + MQTT).

mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  topic_prefix: spa
  discovery: true

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80

time:
  - platform: sntp
    id: sntp_time

uart:
  id: spa_uart
  # ESP32-C3 UART1 via the GPIO matrix. TX->HW-0519 RXD, RX<-HW-0519 TXD.
  # (Auto-direction module: no DE/RE pin. Avoid strapping GPIO2/8/9, flash 12-17, USB 18/19, UART0 20/21.)
  tx_pin: GPIO4
  rx_pin: GPIO5
  baud_rate: 115200
  rx_buffer_size: 512

balboa_spa:
  id: spa
  uart_id: spa_uart
  time_id: sntp_time
  read_only: true   # FLIP TO false ONLY AFTER confirming clean decode (see docs/bring-up)

packages:
  spa_entities: !include packages/spa_full_superset.yaml
