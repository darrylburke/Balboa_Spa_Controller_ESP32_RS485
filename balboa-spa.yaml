esphome:
  name: balboa-spa
  friendly_name: Hot Tub

external_components:
  - source:
      type: local
      path: components

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    # esp-idf: required for mqtt certificate_authority (TLS to champion).
    type: esp-idf

wifi:
  # 2.4 GHz only (ESP32-C3 has no 5 GHz radio). Highest priority wins when
  # both are visible; the device stays put until it drops, then re-evaluates.
  # BG25OUTDOOR failover suspended during bring-up (its retry/hidden-SSID
  # phases kept interrupting BG52). Restore once the RS-485 side is working:
  #   - ssid: !secret wifi_ssid_outdoor
  #     password: !secret wifi_password_outdoor
  #     priority: 10
  # This C3 board cannot hold WiFi at full TX power (20 dB): the AP never hears
  # it ('Auth Expired' at full RSSI). Verified on the spa 2026-09-25 — raising it
  # took the device offline until reflashed over USB.
  output_power: 8.5dB
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  ap:
    ssid: "Balboa-Spa Fallback"
    password: !secret ap_password

captive_portal:

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG
  # C3: RS-485 is on UART1 (GPIO4/5), so UART0/USB stays free for logs.
  # Logs stream over the native USB Serial/JTAG (+ web_server + MQTT).

